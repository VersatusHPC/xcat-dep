# SUSE Linux Enterprise Server 12 SP5 chroot for the xCAT dependency build.
#
# WHY THIS IS NOT A mock-core-configs TARGET: mock ships no SLE config at all, because SLE
# repositories need a subscription. openSUSE Leap is the public counterpart, and Leap 15.6
# serves SLE 15 -- but SLE 12's counterpart is openSUSE 42.x, which is end of life since 2019
# and which mock does not ship either. So SLE 12 is built from the media, not from a mirror.
#
# The media is the SLE-12-SP5-Server DVD, staged as an rpm-md repository on the shared tree by
# ci staging (the DVD itself is YaST-style and carries no repodata). It is a GA medium with no
# maintenance updates: the packages here are those of 2019-11, and nothing later is reachable.
#
# There is no bootstrap image for SLE, so mock builds the bootstrap chroot from this repo with
# the host package manager. gpgcheck is off because the staged repo is re-indexed locally and
# the DVD's own signatures do not cover the generated metadata.
config_opts['root'] = 'sles-12.5-x86_64'
config_opts['description'] = 'SUSE Linux Enterprise Server 12 SP5 x86_64 (xCAT dependency build)'
config_opts['target_arch'] = 'x86_64'
config_opts['legal_host_arches'] = ('x86_64',)
config_opts['dist'] = 'suse.sle12'
config_opts['releasever'] = '12.5'
config_opts['macros']['%dist'] = '.suse.sle12'
# SLE 12 ships rpm 4.11, which predates these macros. The Fedora source rpms this build
# rebuilds call them, and an undefined macro reaches the shell verbatim: %build then dies
# with "fg: no job control" rather than saying a macro is missing.
config_opts['macros']['%make_build'] = 'make %{?_smp_mflags}'
config_opts['macros']['%make_install'] = 'make install DESTDIR=%{buildroot} ; find %{buildroot} -name perllocal.pod -delete ; find %{buildroot} -name .packlist -delete'
config_opts['macros']['%license'] = '%doc'
config_opts['package_manager'] = 'dnf'
config_opts['use_bootstrap_image'] = False
# mock builds its bootstrap chroot by installing python3-dnf from the TARGET's repos. SLE 12
# SP5 ships no python3-dnf, so bootstrap dies with "No match for argument: python3-dnf" before
# the real chroot is touched. Install straight into the chroot with the host's dnf instead.
config_opts['use_bootstrap'] = False
config_opts['extra_chroot_dirs'] = [ '/run/lock', ]
config_opts['ssl_ca_bundle_path'] = '/var/lib/ca-certificates/ca-bundle.pem'

# SLE 12 names the build pattern differently from Leap: there is no
# patterns-devel-base-devel_rpm_build, the equivalent is patterns-sles-Basis-Devel.
config_opts['chroot_setup_cmd'] = 'install patterns-sles-Basis-Devel rpm-build'

config_opts['dnf.conf'] = """
[main]
keepcache=1
debuglevel=2
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=0
assumeyes=1
syslog_ident=mock
syslog_device=
install_weak_deps=0
metadata_expire=0
best=1
excludepkgs=*.i586,*.i686
protected_packages=

[sles-12.5-media]
name=SUSE Linux Enterprise Server 12 SP5 - x86_64 - Media
baseurl=file:///opt/xcat-ci-shared/isos/sle-12-sp5-x86_64
enabled=1
gpgcheck=0
"""

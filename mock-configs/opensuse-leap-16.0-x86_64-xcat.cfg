# openSUSE Leap 16.0 x86_64 for the xCAT dependency build: the stock configuration with one key
# replaced. rpm-sequoia rejects the ALP-Main key in distribution-gpg-keys 1.123 and earlier
# ("No binding signature"), so every package fails its GPG check. openSUSE publishes a current
# copy of the same key beside the repository. dnf reads it inside the chroot, so it is a URL.
include('/etc/mock/opensuse-leap-16.0-x86_64.cfg')
config_opts['root'] = 'opensuse-leap-16.0-x86_64-xcat'
config_opts['dnf.conf'] = config_opts['dnf.conf'].replace('file:///usr/share/distribution-gpg-keys/suse/RPM-GPG-KEY-SuSE-ALP-Main', 'https://download.opensuse.org/distribution/leap/16.0/repo/oss/gpg-pubkey-09d9ea69-68595a8c.asc')
